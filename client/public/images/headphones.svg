<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 460" fill="none" role="img" aria-label="Over-ear headphones">
  <defs>
    <linearGradient id="band" x1="220" y1="80" x2="220" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2C3037"/>
      <stop offset="1" stop-color="#14161A"/>
    </linearGradient>
    <linearGradient id="cup" x1="44" y1="286" x2="136" y2="414" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#262A31"/>
      <stop offset="1" stop-color="#0E1014"/>
    </linearGradient>
  </defs>

  <!-- Headband -->
  <path d="M92 270V214a128 128 0 0 1 256 0v56" stroke="url(#band)" stroke-width="36" stroke-linecap="round"/>
  <!-- Inner cushion shading -->
  <path d="M110 216a110 110 0 0 1 220 0" stroke="#0B0D10" stroke-width="9" stroke-linecap="round" opacity="0.45"/>
  <!-- Electric accent stripe along the top of the band -->
  <path d="M92 214a128 128 0 0 1 256 0" stroke="#C9F227" stroke-width="5" stroke-linecap="round"/>

  <!-- Left yoke + cup -->
  <rect x="74" y="248" width="34" height="54" rx="12" fill="#1B1E24"/>
  <rect x="44" y="286" width="92" height="128" rx="40" fill="url(#cup)"/>
  <rect x="58" y="300" width="64" height="100" rx="30" fill="#0B0D10"/>
  <circle cx="90" cy="350" r="22" fill="#1B1E24"/>
  <circle cx="90" cy="350" r="10" fill="#C9F227"/>

  <!-- Right yoke + cup -->
  <rect x="332" y="248" width="34" height="54" rx="12" fill="#1B1E24"/>
  <rect x="304" y="286" width="92" height="128" rx="40" fill="url(#cup)"/>
  <rect x="318" y="300" width="64" height="100" rx="30" fill="#0B0D10"/>
  <circle cx="350" cy="350" r="22" fill="#1B1E24"/>
  <circle cx="350" cy="350" r="10" fill="#C9F227"/>
</svg>